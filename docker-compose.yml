# Both hubs are the same image. The hostname (ccd. / prasad.) chooses which rack to show.
services:
  ccd-port:
    build: .
    image: ccd-port:latest
    container_name: ccd-port
    restart: unless-stopped
    ports:
      - "2025:80"

  prasad-port:
    build: .
    image: ccd-port:latest
    container_name: prasad-port
    restart: unless-stopped
    ports:
      - "2026:80"
