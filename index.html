<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCD Projects — Center For Career Development, IIT Guwahati</title>
  <meta
    name="description"
    content="Projects and routes maintained by the Center For Career Development, IIT Guwahati."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <main class="container">
    <header>
      <div class="meta-lead">Center For Career Development, IIT Guwahati</div>
      <h1>CCD Projects</h1>
      <p class="intro">
        Every route and project the placement cell runs, with a link to its source. Maintained by <a href="https://avinashgupta.in">Avinash</a>.
      </p>
    </header>

    <section class="ledger" aria-label="Projects Ledger">
      <div class="ledger-head" aria-hidden="true">
        <span>#</span>
        <span>Project &amp; Function</span>
        <span>Deployment Route</span>
        <span>Source Code</span>
      </div>

      <ol class="entry-list" id="project-list">
        <!-- entries injected by app.js from projects.json -->
      </ol>
      <p class="empty-state" id="empty-state" hidden>Nothing listed yet.</p>
    </section>

    <footer>
      <div class="footer-left">INTERNAL REFERENCE // CCD IIT GUWAHATI</div>
      <div class="footer-right" id="project-count"></div>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
