<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCD | Center For Career Development, IITG</title>
    <meta
      name="description"
      content="Projects and routes maintained by the Center For Career Development, IIT Guwahati."
    />
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body class="bg-primary text-white-100 min-h-screen">
    <div class="max-w-3xl mx-auto px-6 py-16 sm:py-20">
      <header class="mb-12 sm:mb-16">
        <p class="text-secondary text-sm tracking-wide uppercase mb-2">
          Center For Career Development, IITG
        </p>
        <h1 class="text-2xl sm:text-3xl font-semibold">CCD Projects</h1>
        <p class="text-secondary mt-3 text-sm sm:text-base leading-relaxed">
          Every route and project the placement cell runs, with a link to its
          source. Maintained by
          <a
            href="https://avinashgupta.in"
            class="underline decoration-secondary/50 hover:decoration-accent hover:text-accent transition-colors"
            >Avinash</a
          >.
        </p>
      </header>

      <main>
        <ul id="project-list" class="divide-y divide-white-100/10">
          <!-- rows injected by app.js -->
        </ul>
        <p
          id="empty-state"
          class="text-secondary text-sm hidden"
        >
          Nothing listed yet.
        </p>
      </main>

      <footer class="mt-16 pt-8 border-t border-white-100/10">
        <a
          href="https://avinashgupta.in"
          class="text-secondary text-sm hover:text-accent transition-colors"
          >&larr; back to avinashgupta.in</a
        >
      </footer>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
