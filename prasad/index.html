<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIMS Projects - Prasad Institute of Medical Sciences</title>
  <meta
    name="description"
    content="Projects and routes built for Prasad Institute of Medical Sciences."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="layout-wrapper">

    <header class="context-rail">
      <h1>PIMS Projects</h1>
      <p class="subtitle">Prasad Institute of Medical Sciences</p>

        Every route and project built for the institute, with a link to its source.

    <main class="data-rail">
      <ul class="project-list" id="project-list">

      </ul>
      <p class="empty-state" id="empty-state" hidden>Nothing listed yet.</p>
    </main>

  </div>

  <script src="./app.js"></script>

</html>
